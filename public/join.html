<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Poker Room</title>

    <link rel="stylesheet" href="css/theme-core.css">
    <link rel="stylesheet" href="css/theme-poker.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/breathing-waves.css">
</head>

<body class="app-page">

    <div id="connection-status" class="connecting">Connecting...</div>

    <main id="join-section" class="login-page">
        <header class="header-band login-band" data-breathing-waves data-wave-palette="poker">
            <canvas></canvas>
            <div class="header-content">
                <p class="eyebrow">Planning room</p>
                <h1 id="entry-title" class="header-title">Scrum Poker</h1>
                <p class="header-subtitle">Join a shared estimation room.</p>
            </div>
        </header>

        <div class="entry-shell">
        <section class="entry-card" aria-labelledby="entry-title">
            <div class="entry-form">
                <label class="field" id="name-field" for="join-name-input">
                    <span>Your name</span>
                    <input type="text" id="join-name-input" placeholder="Your name" autocomplete="name">
                </label>

                <button id="join-button" class="btn btn-primary">
                    Join
                </button>

                <p id="join-error" class="form-error hidden"></p>
            </div>
        </section>
        </div>
    </main>

    <main id="poker-room-section" class="room-page hidden">
        <header class="header-band" data-breathing-waves data-wave-palette="poker">
            <canvas></canvas>
            <div class="header-content">
                <p class="eyebrow">Estimation room</p>
                <h1 class="header-title">Scrum Poker Room</h1>
                <p id="room-display" class="header-subtitle room-display"></p>
            </div>
        </header>

        <div class="room-shell">
        <div class="room-userbar">
            <span id="user-greeting" class="user-greeting"></span>
        </div>

        <div class="room-grid">
            <section class="room-card vote-panel" aria-labelledby="vote-panel-title">
                <div class="section-heading">
                    <div>
                        <span class="section-kicker">Vote</span>
                        <h2 id="vote-panel-title">Cast your vote</h2>
                    </div>
                    <span id="round-status" class="status-pill">Open</span>
                </div>

                <div id="voting-cards" class="voting-deck sticker-grid" aria-label="Voting cards">
                    <span class="observer-note hidden" id="observer-message">Observers cannot vote.</span>
                </div>
                <p id="vote-error" class="form-error room-error hidden"></p>
            </section>

            <section class="room-card participants-panel" aria-labelledby="participants-title">
                <div class="section-heading">
                    <div>
                        <span class="section-kicker">Room</span>
                        <h2 id="participants-title">Participants</h2>
                    </div>
                </div>
                <div id="participants-list" class="participants-list"></div>
            </section>

            <section id="vote-summary" class="room-card result-card hidden" aria-labelledby="results-title">
                <div class="section-heading compact">
                    <div>
                        <span class="section-kicker">Results</span>
                        <h2 id="results-title">Vote Results</h2>
                    </div>
                </div>
                <p>Average Vote: <span id="average-vote">--</span></p>
            </section>

            <section id="ordered-votes" class="room-card grouped-results hidden" aria-labelledby="grouped-results-title">
                <div class="section-heading compact">
                    <div>
                        <span class="section-kicker">Grouped</span>
                        <h2 id="grouped-results-title">Grouped Results</h2>
                    </div>
                </div>
                <div id="ordered-votes-list" class="ordered-votes-list"></div>
            </section>

        </div>
        </div>
    </main>

    <footer class="app-footer">
        <a href="/license">License Terms</a>
    </footer>

    <script src="js/cardDeck.js?v=1" defer></script>
    <script src="js/breathing-waves.js" defer></script>
    <script src="js/join.js?v=1" defer></script>
</body>
</html>
