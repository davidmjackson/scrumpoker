<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Access | Scrum Poker Tool</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-heading">
      <span class="entry-kicker">Admin</span>
      <h1>Team access</h1>
      <p>Scrum Poker administration</p>
    </div>
    <a href="/" class="secondary-action admin-room-link">Room app</a>
  </header>

  <main class="admin-shell">
    <section class="admin-panel auth-panel" aria-labelledby="admin-auth-title">
      <div class="section-heading compact">
        <div>
          <span class="section-kicker">Secure</span>
          <h2 id="admin-auth-title">Unlock admin</h2>
        </div>
      </div>
      <form id="auth-form" class="admin-form">
        <label class="field" for="admin-key-input">
          <span>Admin key</span>
          <input id="admin-key-input" name="adminKey" type="password" autocomplete="current-password">
        </label>
        <button type="submit" class="primary-action">Unlock</button>
      </form>
      <p id="admin-status" class="admin-status" role="status"></p>
    </section>

    <section id="keys-panel" class="admin-panel keys-panel hidden" aria-labelledby="keys-title">
      <div class="admin-panel-header">
        <div>
          <span class="section-kicker">Teams</span>
          <h2 id="keys-title">Team keys</h2>
        </div>
        <div class="admin-panel-actions">
          <span id="key-count" class="admin-count">0 teams</span>
          <button id="refresh-keys-button" type="button" class="secondary-action compact-action">Refresh</button>
        </div>
      </div>

      <form id="create-key-form" class="admin-form">
        <label class="field" for="key-name-input">
          <span>Team name</span>
          <input id="key-name-input" name="keyName" type="text" maxlength="64" autocomplete="off">
        </label>
        <button type="submit" class="primary-action">Create key</button>
      </form>

      <div class="admin-invite-options">
        <label class="field" for="invite-room-input">
          <span>Invite room</span>
          <input id="invite-room-input" name="inviteRoom" type="text" maxlength="64" placeholder="Optional room name" autocomplete="off">
        </label>

        <label class="field" for="invite-role-select">
          <span>Invite role</span>
          <select id="invite-role-select" name="inviteRole">
            <option value="Facilitator" selected>Facilitator</option>
            <option value="Voter">Voter</option>
            <option value="Observer">Observer</option>
          </select>
        </label>
      </div>

      <div id="keys-list" class="admin-key-list"></div>
    </section>
  </main>
</body>
</html>
