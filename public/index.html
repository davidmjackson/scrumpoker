<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker Tool</title>
    <link rel="stylesheet" href="css/tailwind.min.css">

    <script src="js/app.js?v=2" defer></script>

    <link rel="stylesheet" href="css/app.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div id="connection-status" class="connecting">Connecting...</div>

    <div id="login-section" class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm text-center">

        <h1 class="text-2xl font-bold mb-6 text-gray-700">Welcome to Scrum Poker</h1>

        <input   type="text"  id="access-key-input" placeholder="Enter your Key" class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" required />

        <input type="text" id="room-input" placeholder="Enter or create a room name" class="w-full px-4 py-2 border rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"/>

        <input type="text" id="name-input" placeholder="Enter your name" class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <label for="role-select" class="block text-sm font-medium text-gray-700">Choose a role</label>

        <select id="role-select" class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Voter" selected>Voter</option>
            <option value="Observer">Observer</option>
            <option value="Facilitator">Facilitator</option>
        </select>

        <button id="login-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200 disabled:opacity-50" disabled>
            Enter Room (Connecting...)
        </button>

        <p id="login-error" class="text-red-500 text-sm mt-2 hidden"></p>

    </div>

    <div id="poker-room-section" class="hidden w-full max-w-4xl mx-auto">
       <div id="room-display" class="text-lg font-semibold mb-4 text-center"> </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h1 class="text-3xl font-bold text-gray-800">Scrum Poker Room</h1>
                 
                <div>

                    <span id="user-greeting" class="text-gray-600 mr-4"></span>

                <button id="edit-role-button" class="text-sm text-blue-600 hover:underline">Change Role</button>
                <button id="logout-button" class="text-sm text-red-600 hover:underline ml-2">Logout</button>

                </div>
            </div>

            <div class="mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Cast Your Vote:</h2>

                <div id="voting-cards" class="flex flex-wrap justify-center gap-2">
                    <span class="text-gray-500 text-sm italic hidden" id="observer-message">Observers cannot vote.</span>



                </div>
                 <p id="vote-error" class="text-red-500 text-sm mt-2 text-center hidden"></p>
            </div>

            <div>
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Participants</h2>
                <div id="participants-list" class="space-y-3">
                    </div>
            </div>

             <div id="vote-summary" class="mt-6 pt-4 border-t hidden">
                 <h3 class="text-lg font-semibold text-gray-700">Vote Results</h3>
                 <p class="text-gray-600">Average Vote: <span id="average-vote" class="font-bold">--</span></p>
            </div>

            <div id="ordered-votes" class="mt-4 hidden">
                <h3 class="text-lg font-semibold text-gray-700">Grouped Results</h3>
                <div id="ordered-votes-list" class="space-y-3"></div>
            </div>

            <div id="facilitator-controls" class="mt-8 text-center hidden">
                <button id="show-votes-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-md transition duration-200 mr-2 disabled:opacity-50">
                    Show Votes
                </button>
                 <button id="reset-votes-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-5 rounded-md transition duration-200 disabled:opacity-50">
                    Reset Votes
                </button>
            </div>
        </div>
    </div>

    <div id="edit-role-modal" class="modal-overlay hidden">
          <div class="modal-content">
           <h2 class="text-xl font-semibold mb-4">Change Your Role</h2>
            <label for="edit-role-select" class="block text-sm font-medium text-gray-700 mb-2">New Role</label>
            <select id="edit-role-select" class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
             <option value="Voter">Voter</option>
             <option value="Observer">Observer</option>
              <option value="Facilitator">Facilitator</option>
            </select>
                <p id="edit-role-error" class="text-red-500 text-sm mb-2 hidden"></p>
            <div class="flex justify-end gap-3">
              <button id="cancel-edit-role-button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-md">Cancel</button>
            <button id="save-role-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Save</button>
           </div>
         </div>
        </div>


    <footer class="fixed bottom-3 left-1/2 -translate-x-1/2 rounded-full bg-white/90 px-3 py-1 text-xs text-gray-600 shadow-sm backdrop-blur">
        <a href="/license" class="text-blue-700 hover:underline">License Terms</a>
    </footer>

</body>
</html>
