name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - 'feature/**'

jobs:
  checks:
    name: Node checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Check CLI syntax
        run: node --check manageKeys.js

      - name: Check helper syntax
        run: |
          for file in lib/*.js; do
            node --check "$file"
          done

      - name: Check browser script syntax
        run: |
          for file in public/js/*.js; do
            node --check "$file"
          done

      - name: Check test syntax
        run: |
          for file in tests/*.test.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev
